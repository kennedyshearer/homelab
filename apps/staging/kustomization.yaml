apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - linkding
  - audiobookshelf
  - homepage
  - forgejo
  - pgadmin
  - n8n
  - wallabag

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
        labels:
          homelab.kennedyhomelab.net/ups-shutdown: "true"
