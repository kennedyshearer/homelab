apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres-cluster
  namespace: forgejo

spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  imagePullPolicy: IfNotPresent

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-postgres-creds

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: s3-store-db

  storage:
    storageClass: longhorn
    size: 5Gi

