apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config-longhorn
  labels:
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
