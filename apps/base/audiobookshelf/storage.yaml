apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  labels:
    recurring-job-group.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
---
